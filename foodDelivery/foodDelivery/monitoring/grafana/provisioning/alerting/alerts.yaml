apiVersion: 1

groups:
  - orgId: 1
    name: 'FoodDeliveryAlerts'
    folder: 'E-Commerce Monitoring'
    interval: 1m
    rules:
      - uid: api_latency_alert
        title: 'API p95 Latency Alert (> 1s)'
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: 'histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 1.0'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        annotations:
          summary: 'High API latency detected'
          description: 'API p95 response time has exceeded 1 second for the past 2 minutes.'
        labels:
          severity: critical

      - uid: api_error_rate_alert
        title: 'API Error Rate Alert (> 5% in 5m)'
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: '(sum(rate(http_server_requests_seconds_count{status=~"5..\"}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) * 100) > 5.0'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        annotations:
          summary: 'High API error rate'
          description: 'API HTTP 5xx error rate has exceeded 5% for the past 5 minutes.'
        labels:
          severity: critical

      - uid: db_pool_saturation_alert
        title: 'Database Connection Pool Saturation'
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: 'hikaricp_connections_active >= (hikaricp_connections_active + hikaricp_connections_idle) * 0.9'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: NoData
        execErrState: Alerting
        for: 1m
        annotations:
          summary: 'Database connection pool near saturation'
          description: 'HikariCP active connections have exceeded 90% of total pool size.'
        labels:
          severity: warning

      - uid: kafka_consumer_lag_alert
        title: 'Kafka Consumer Lag Backlog Alert'
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: '(sum(rate(ecommerce_kafka_messages_produced_total[5m])) - sum(rate(ecommerce_kafka_messages_consumed_total[5m]))) > 10'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: 'Kafka consumer lag accumulation detected'
          description: 'Kafka producer rate exceeds consumer rate by more than 10 messages/sec over 5 minutes.'
        labels:
          severity: warning

contactPoints:
  - orgId: 1
    name: SlackPlaceholder
    receivers:
      - uid: slack_receiver
        type: slack
        settings:
          url: 'https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX'
          recipient: '#monitoring-alerts'
  - orgId: 1
    name: EmailPlaceholder
    receivers:
      - uid: email_receiver
        type: email
        settings:
          addresses: 'oncall@example.com'

policies:
  - orgId: 1
    receiver: SlackPlaceholder
    group_by: ['alertname', 'cluster', 'service']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: EmailPlaceholder
        matchers:
          - severity = critical
