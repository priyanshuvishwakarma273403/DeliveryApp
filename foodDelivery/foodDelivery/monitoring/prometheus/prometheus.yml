global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'food-delivery-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8081']

  - job_name: 'food-delivery-render'
    metrics_path: '/api/actuator/prometheus'
    scheme: https
    static_configs:
      - targets: ['deliveryapp-wwx8.onrender.com:443']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
