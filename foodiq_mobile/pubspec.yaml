name: foodiq_mobile
description: "FoodIQ – Production-Ready Mobile Food Delivery Platform (Customer, Rider, Restaurant, Admin)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  
  # Navigation & Routing
  go_router: ^14.2.0

  # Networking & HTTP
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Secure Storage & Persistence
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI, Images & Theming
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1

  # Configuration & Utilities
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  logger: ^2.3.0
  uuid: ^4.4.0

  # Real-Time WebSocket / STOMP
  stomp_dart_client: ^1.0.0

  # Geo & Maps
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
